name: Dashboard CI

on:
  pull_request:
    branches:
      - main
      - codex/phase-1-6-audit-remediation
      - codex/phase-7-promotions-discounts
      - codex/phase-8-reporting-accounting-audit
      - codex/phase-9-payments-refunds-integrations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Live POS browser regression
        run: npm run test:e2e

      - name: Preview isolation browser regression
        run: npm run test:e2e:preview

      - name: Production build
        run: npm run build
